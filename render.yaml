# Render Blueprint for the Django backend.
# In Render: New + -> Blueprint -> pick this repo. Render reads this file,
# then asks for every value marked "sync: false" (paste them in the dashboard).

services:
  - type: web
    name: yatra-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn backend.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Supabase Postgres: the pooler connection string (Session pooler, port 5432).
      - key: DATABASE_URL
        sync: false

      # Your Vercel site, e.g. https://yatra-travel.vercel.app (comma-separate several).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Same Google OAuth Client ID as the frontend's VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Supabase Storage (S3) for uploaded images.
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media

      # Optional: Gmail address + App Password to actually send emails.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
